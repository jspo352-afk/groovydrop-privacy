<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>근무표 공유 | Grid by Day</title><style>body{font-family:system-ui,sans-serif;background:#f6f8fb;color:#182638;margin:0}main{max-width:520px;margin:8vh auto;padding:28px;background:white;border-radius:20px;box-shadow:0 8px 28px #18263812}h1{font-size:24px}p{line-height:1.7}.btn{display:block;background:#226b9a;color:white;text-decoration:none;padding:15px;border-radius:12px;text-align:center;font-weight:bold;margin:16px 0}.muted{color:#64748b;font-size:14px}#details{white-space:pre-line}</style></head><body><main><h1>Grid by Day 근무표 공유</h1><p id="details">공유된 근무표를 확인하는 중...</p><a id="open" class="btn" hidden>앱에서 근무표 가져오기</a><a class="btn" style="background:#334155" href="https://play.google.com/store/apps/details?id=com.gridbyday.app">Google Play에서 앱 보기</a><p class="muted">근무표를 가져오기 전에 앱에서 확인할 수 있습니다. 개인 급여·메모·연차 기록은 공유되지 않습니다.</p></main><script>
const encoded=new URLSearchParams(location.search).get('data');
const details=document.getElementById('details');
try {
if(!encoded||encoded.length>30000)throw Error('유효한 공유 데이터가 없습니다.');
const p=JSON.parse(decodeURIComponent(encoded));
if(p.format!=='grid-by-day-share'||p.version!==1||!Array.isArray(p.shiftTypes)||!Array.isArray(p.pattern)||p.shiftTypes.length>100||!['repeat','monthly'].includes(p.mode))throw Error('지원하지 않는 근무표입니다.');
details.textContent='유형: '+(p.mode==='monthly'?'매월 편성형':'고정 반복형')+'\n근무 종류: '+p.shiftTypes.map(x=>String(x.name||'').slice(0,40)).join(', ')+'\n기준일: '+String(p.patternStartDate||'')+(p.month?'\n대상 월: '+String(p.month):'');
const open=document.getElementById('open');open.href='mobile://share?data='+encodeURIComponent(encoded);open.hidden=false;
}catch(e){details.textContent='공유 링크를 확인할 수 없습니다. 보낸 사람에게 새 링크를 요청해 주세요.'}
</script></body></html>
